<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD-Tool - 系统动力学模拟工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 工具栏 ===== -->
<div id="toolbar">
  <div class="toolbar-group">
    <button id="btn-new" title="新建模型 (Ctrl+N)" class="toolbar-btn">
      <span class="tb-icon">📄</span>
    </button>
    <button id="btn-save" title="保存模型 (Ctrl+S)" class="toolbar-btn">
      <span class="tb-icon">💾</span>
    </button>
    <button id="btn-load" title="加载模型" class="toolbar-btn">
      <span class="tb-icon">📂</span>
    </button>
  </div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group">
    <button id="btn-undo" title="撤销 (Ctrl+Z)" class="toolbar-btn" disabled>
      <span class="tb-icon">↩</span>
    </button>
    <button id="btn-redo" title="重做 (Ctrl+Y)" class="toolbar-btn" disabled>
      <span class="tb-icon">↪</span>
    </button>
  </div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group">
    <button id="btn-zoom-out" title="缩小 (-)" class="toolbar-btn">
      <span class="tb-icon">🔍−</span>
    </button>
    <span id="zoom-level" class="zoom-label">100%</span>
    <button id="btn-zoom-in" title="放大 (+)" class="toolbar-btn">
      <span class="tb-icon">🔍+</span>
    </button>
    <button id="btn-fit" title="适应画布" class="toolbar-btn">
      <span class="tb-icon">⊞</span>
    </button>
  </div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-group">
    <span id="coords-display" class="coords-label">0, 0</span>
  </div>
  <div class="toolbar-divider"></div>
  <div class="toolbar-group">
    <button id="btn-help" title="帮助" class="toolbar-btn">
      <span class="tb-icon">❓</span>
    </button>
  </div>
</div>

<!-- ===== 主布局 ===== -->
<div id="main-layout">

  <!-- 左侧面板 -->
  <div id="left-panel">

    <!-- 模块面板 -->
    <div class="panel-section">
      <div class="panel-title">🧱 模块</div>
      <div class="palette-list">
        <div class="palette-item" draggable="true" data-type="stock">
          <div class="palette-icon palette-stock">□</div>
          <div class="palette-label">存量</div>
          <div class="palette-desc">记录变量的数量/水平</div>
        </div>
        <div class="palette-item" draggable="true" data-type="source-sink">
          <div class="palette-icon palette-source-sink">☁</div>
          <div class="palette-label">源 / 汇</div>
          <div class="palette-desc">产生输入或吸收输出</div>
        </div>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- 模块列表 -->
    <div class="panel-section panel-fill">
      <div class="panel-title">📋 模块列表</div>
      <div id="module-list" class="module-list">
        <div class="module-list-empty">拖拽模块到画布开始建模</div>
      </div>
    </div>
  </div>

  <!-- 画布区域 -->
  <div id="canvas-container">
    <canvas id="canvas-main"></canvas>

    <!-- 小地图 -->
    <canvas id="minimap"></canvas>

    <!-- 空白画布提示 -->
    <div id="canvas-hint">
      <div class="hint-icon">🧱</div>
      <div class="hint-title">拖拽模块到此处开始构建模型</div>
      <div class="hint-text">或右键画布创建模块 · 选中模块后在属性面板中连线</div>
    </div>
  </div>

  <!-- 右侧属性面板 -->
  <div id="property-panel" class="collapsed">
    <div id="property-panel-header">
      <span>📝 属性</span>
      <button id="btn-close-props" class="btn-icon">✕</button>
    </div>
    <div id="property-panel-content"></div>
  </div>

</div>

<!-- ===== 上下文菜单 ===== -->
<ul id="context-menu" class="hidden">
  <li data-action="edit">✏️ 编辑属性</li>
  <li data-action="connect">🔗 连线到此模块</li>
  <li data-action="duplicate">📋 复制模块</li>
  <li class="context-separator"></li>
  <li data-action="delete" class="context-danger">🗑️ 删除</li>
</ul>

<!-- ===== 模态对话框 ===== -->
<div id="modal-overlay" class="hidden">
  <div id="modal-dialog"></div>
</div>

<!-- ===== Toast 提示 ===== -->
<div id="toast" class="toast"></div>

<!-- ===== 脚本 (按依赖顺序加载) ===== -->
<script src="js/utils.js"></script>
<script src="js/constants.js"></script>
<script src="js/data-model.js"></script>
<script src="js/canvas-renderer.js"></script>
<script src="js/undo-redo.js"></script>
<script src="js/persistence.js"></script>
<script src="js/interaction.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
